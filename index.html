<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Projectile Master</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls">
        <label for="angleSlider">Angle (θ): <span id="angleValue">45</span>°</label>
        <input type="range" id="angleSlider" min="0" max="90" value="45">

        <label for="velocitySlider">Velocity (u): <span id="velocityValue">50</span> m/s</label>
        <input type="range" id="velocitySlider" min="1" max="100" value="50">

        <button id="launchBtn">Launch</button>
    </div>
    <div id="infoPanel">
        <h2>Physics Info</h2>
        <p><strong>Range:</strong> <span id="rangeValue">-</span> m</p>
        <p><strong>Max Height:</strong> <span id="heightValue">-</span> m</p>
        <p><strong>Time of Flight:</strong> <span id="timeValue">-</span> s</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
